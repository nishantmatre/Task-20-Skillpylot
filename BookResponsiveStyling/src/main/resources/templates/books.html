<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Management</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><main class="container"><header class="heading heading-row"><div><p class="eyebrow">BOOK MANAGEMENT</p><h1>My Books</h1><p class="muted">View, add, edit and remove books.</p></div><a class="btn primary" th:href="@{/books/new}">+ Add New Book</a></header><section class="panel table-wrap"><table><thead><tr><th>ID</th><th>Book Title</th><th>Author</th><th>Actions</th></tr></thead><tbody><tr th:each="b:${books}"><td data-label="ID" th:text="${b.id}"></td><td data-label="Book Title" th:text="${b.title}"></td><td data-label="Author" th:text="${b.author}"></td><td data-label="Actions"><a th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a> <a class="delete" th:href="@{/books/{id}/delete(id=${b.id})}" onclick="return confirm('Delete this book?')">Delete</a></td></tr><tr th:if="${#lists.isEmpty(books)}"><td colspan="4" class="empty">No books found. Add your first book.</td></tr></tbody></table></section></main></body></html>
