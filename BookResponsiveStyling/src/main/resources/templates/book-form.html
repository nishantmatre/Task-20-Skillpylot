<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${pageTitle}">Book Form</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><main class="container narrow"><header class="heading"><p class="eyebrow">BOOK MANAGEMENT</p><h1 th:text="${pageTitle}">Book Form</h1><p class="muted">Enter book details below.</p></header><section class="panel"><form th:object="${book}" th:action="${book.id == null}?@{/books}:@{/books/{id}(id=${book.id})}" method="post"><div class="field"><label for="title">Book Title</label><input id="title" th:field="*{title}" placeholder="Enter book title"><small class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small></div><div class="field"><label for="author">Author Name</label><input id="author" th:field="*{author}" placeholder="Enter author name"><small class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></small></div><div class="actions"><button class="btn primary" type="submit">Save Book</button><a class="btn secondary" th:href="@{/books}">Cancel</a></div></form></section></main></body></html>
